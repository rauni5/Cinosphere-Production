# src/main/resources/application.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/cinosphere
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Use 'update' during development if you want Hibernate to auto-update tables.
# Use 'validate' or 'none' in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port
server.port=8080

# JWT secret (change this to a long random string in production)
jwt.secret=cinosphere_super_secret_key_change_in_prod_2024
jwt.expiration=86400000

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB